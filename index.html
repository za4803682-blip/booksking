<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksking Elite - Next-Gen Global Hub</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2b;
            --text-primary: #f8f9fa;
            --text-secondary: #94a3b8;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --gold-color: #f59e0b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding: 15px 25px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--gold-color);
        }
        .stats-badge {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold-color);
            color: var(--gold-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .auth-container {
            max-width: 450px;
            margin: 40px auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .auth-container h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 16px;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }
        .card h3 {
            color: var(--gold-color);
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-primary);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">👑 Booksking Elite Hub</div>
        <div class="stats-badge" id="visitorCounter">Visitors: Loading...</div>
    </header>

    <!-- واجهة تسجيل الدخول الاحترافية (بسيطة وأسرع من أمازون) -->
    <div class="auth-container" id="authBox">
        <h2>Boss & User Portal</h2>
        <div class="input-group">
            <label>Email or Username</label>
            <input type="text" id="usernameInput" placeholder="Enter your name or email">
        </div>
        <div class="input-group">
            <label>Secure Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        <button class="btn-primary" onclick="handleLogin()">Sign In & Launch Platform</button>
    </div>

    <!-- لوحة التحكم الرئيسية بعد تسجيل الدخول -->
    <div class="dashboard" id="dashboardBox">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 id="welcomeUser" style="font-size: 28px; color: var(--gold-color);"></h1>
            <p style="color: var(--text-secondary);">Welcome to the ultimate high-performance decentralized marketplace.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Total Site Visitors</h3>
                <div class="stat-number" id="totalVisits">0</div>
            </div>
            <div class="card">
                <h3>Registered Users</h3>
                <div class="stat-number" id="totalLogins">0</div>
            </div>
            <div class="card">
                <h3>System Status</h3>
                <div class="stat-number" style="color: var(--accent-color);">100% Active</div>
            </div>
        </div>
    </div>

    <script>
        // نظام حساب عدد الزوار الفريدين وتتبع المسجلين
        let visits = localStorage.getItem('booksking_visits') || 1240;
        visits++;
        localStorage.setItem('booksking_visits', visits);
        document.getElementById('visitorCounter').innerText = `Total Visitors: ${visits}`;

        let registeredCount = localStorage.getItem('booksking_reg_count') || 18;
        document.getElementById('totalLogins').innerText = registeredCount;

        function handleLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!username || !password) {
                alert('Please enter both username and password!');
                return;
            }

            // حفظ بيانات المستخدم وكلمة المرور في المتصفح بأمان محلي
            localStorage.setItem('booksking_current_user', username);
            localStorage.setItem(`user_${username}`, password);

            registeredCount++;
            localStorage.setItem('booksking_reg_count', registeredCount);

            // إخفاء صفحة تسجيل الدخول وإظهار لوحة التحكم الفاخرة
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
            document.getElementById('welcomeUser').innerText = `Welcome, Boss ${username}!`;
            document.getElementById('totalVisits').innerText = visits;
            document.getElementById('totalLogins').innerText = registeredCount;
        }

        // التحقق إذا كان المستخدم مسجلاً من قبل
        window.onload = function() {
            const savedUser = localStorage.getItem('booksking_current_user');
            if (savedUser) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
                document.getElementById('welcomeUser').innerText = `Welcome back, Boss ${savedUser}!`;
                document.getElementById('totalVisits').innerText = visits;
                document.getElementById('totalLogins').innerText = registeredCount;
            }
        };
    </script>
</body>
</html>
